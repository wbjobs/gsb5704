<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>图片拼接工作台</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app" id="app">
    <header class="site-header">
      <div>
        <h1>图片拼接工作台</h1>
        <p>长图、四宫格、九宫格与自由布局，本地处理，图片不会上传。</p>
      </div>
      <div class="worker-state" id="workerState">Worker 准备中</div>
    </header>

    <section class="composer">
      <aside class="sidebar">
        <section class="panel">
          <h2>1. 添加图片</h2>
          <label class="dropzone" id="dropzone" tabindex="0">
            <input id="fileInput" type="file" accept="image/*" multiple>
            <strong>选择或拖入多张图片</strong>
            <span>支持 PNG / JPEG / WebP / GIF 首帧等格式</span>
          </label>
        </section>

        <section class="panel">
          <h2>2. 布局</h2>
          <div class="segmented" id="layoutSwitch" role="group" aria-label="布局方式">
            <button type="button" data-layout="long" class="active">长图</button>
            <button type="button" data-layout="grid4">四宫格</button>
            <button type="button" data-layout="grid9">九宫格</button>
            <button type="button" data-layout="free">自由布局</button>
          </div>
        </section>

        <section class="panel controls-grid">
          <h2>3. 样式与导出</h2>

          <label class="field">
            <span>间距 <output id="gapValue">12</output>px</span>
            <input id="gapInput" type="range" min="0" max="120" value="12">
          </label>

          <label class="field">
            <span>圆角 <output id="radiusValue">0</output>px</span>
            <input id="radiusInput" type="range" min="0" max="120" value="0">
          </label>

          <label class="field">
            <span>边框宽度 <output id="borderWidthValue">0</output>px</span>
            <input id="borderWidthInput" type="range" min="0" max="80" value="0">
          </label>

          <label class="field inline-field">
            <span>边框颜色</span>
            <input id="borderColorInput" type="color" value="#ffffff">
          </label>

          <label class="field inline-field">
            <span>背景色</span>
            <input id="bgColorInput" type="color" value="#ffffff">
          </label>

          <label class="field">
            <span>背景不透明度 <output id="bgAlphaValue">100%</output></span>
            <input id="bgAlphaInput" type="range" min="0" max="100" value="100">
          </label>

          <label class="field inline-field">
            <span>导出宽度</span>
            <input id="targetWidthInput" type="number" min="320" max="12000" step="10" value="1080">
          </label>

          <label class="field inline-field">
            <span>导出格式</span>
            <select id="formatInput">
              <option value="image/png">PNG（保留透明）</option>
              <option value="image/webp">WebP（可保留透明）</option>
              <option value="image/jpeg">JPEG（体积更小）</option>
            </select>
          </label>

          <label class="field" id="qualityField">
            <span>导出质量 <output id="qualityValue">92%</output></span>
            <input id="qualityInput" type="range" min="50" max="100" value="92">
          </label>
        </section>
      </aside>

      <main class="workspace">
        <div class="workspace-toolbar">
          <div class="dimensions" id="dimensions">尚未添加图片</div>
          <div class="toolbar-actions">
            <button type="button" id="fitSizeButton" class="secondary" hidden>自动缩小到安全尺寸</button>
            <button type="button" id="exportButton" disabled>导出图片</button>
          </div>
        </div>

        <div id="warningBar" class="warning" hidden></div>

        <div class="preview-scroll" id="previewScroll">
          <div class="stage-wrap" id="stageWrap">
            <div class="stage" id="stage" aria-label="拼接预览"></div>
            <div class="empty-hint" id="emptyHint">添加图片后在此预览；自由布局可直接拖拽图片或右下角缩放。</div>
          </div>
        </div>

        <div class="strip-heading">
          <h2>图片顺序</h2>
          <span>拖拽左侧手柄排序，支持删除和替换</span>
        </div>
        <div class="thumb-list" id="thumbList"></div>
      </main>
    </section>

    <div class="drop-overlay" id="dropOverlay" hidden>松开鼠标即可添加图片</div>
    <input id="replaceInput" type="file" accept="image/*" hidden>
  </div>

  <script type="module" src="src/app.js"></script>
</body>
</html>
